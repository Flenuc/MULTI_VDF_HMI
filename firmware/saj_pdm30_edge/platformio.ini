; SAJ PDM-30 Edge IIoT — multi-board PlatformIO
;
;  env:esp32dev                 — ESP32 classic + SN75176B externo
;  env:guition_jc_esp32p4_m3    — Guition JC-ESP32P4-M3-DEV (RS485 onboard + ETH)

[platformio]
default_envs = esp32dev

; ---------------------------------------------------------------------------
; Shared
; ---------------------------------------------------------------------------
[common]
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  knolleary/PubSubClient @ ^2.8
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
  -DARDUINOJSON_ENABLE_STD_STRING=0
  -Wall
  -Wextra

; ---------------------------------------------------------------------------
; Classic ESP32 DevKit + external RS485
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
; BluetoothSerial + WiFi + PubSub need more app flash than default 1.2 MB
board_build.partitions = min_spiffs.csv
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBOARD_ESP32DEV

; ---------------------------------------------------------------------------
; Guition JC-ESP32P4-M3-DEV (ESP32-P4 + C6 + onboard MAX485 + IP101 ETH)
;
; Requires a PlatformIO platform with ESP32-P4 Arduino support, e.g. pioarduino.
; If the default espressif32 lacks P4, install:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
; ---------------------------------------------------------------------------
[env:guition_jc_esp32p4_m3]
; Prefer pioarduino for P4 (Arduino-esp32 3.3.x / IDF 5.5)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.f_cpu = 360000000L
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
lib_deps = ${common.lib_deps}
build_flags =
  ${common.build_flags}
  -DBOARD_GUITION_JC_ESP32P4_M3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DBOARD_NAME_STR=\"Guition-JC-ESP32P4-M3-DEV\"

; Optional: use custom board JSON in ./boards if platform provides matching variant
; board = guition_jc_esp32p4_m3
; board_dir = boards
