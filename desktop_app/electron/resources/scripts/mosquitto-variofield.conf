# VarioField — Mosquitto fragment (auth required by default)
# Installed as: /etc/mosquitto/conf.d/variofield.conf
#
# For anonymous lab-only mode, install via:
#   sudo VARIOFIELD_MQTT_ANON=1 ./setup_mosquitto.sh
#
# Password + ACL files are written by setup_mosquitto.sh next to this fragment
# unless overridden.

listener 1883
allow_anonymous false
password_file /etc/mosquitto/variofield.passwd
acl_file /etc/mosquitto/variofield.acl

# Listen on all interfaces so the Edge can reach this PC by LAN IP.
# For PC-only testing you may bind: listener 1883 127.0.0.1
