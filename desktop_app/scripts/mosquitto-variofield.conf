# VarioField — Mosquitto fragment for field / lab use
# Installed as: /etc/mosquitto/conf.d/variofield.conf  (Linux)
#           or: %ProgramFiles%\mosquitto\variofield.conf included from mosquitto.conf (Windows)
#
# allow_anonymous=true is intentional for plant benches without auth.
# Restrict with firewall or set credentials if the broker is on a public LAN.

listener 1883
allow_anonymous true
# Listen on all interfaces so the Edge module can reach this PC by LAN IP.
# For PC-only testing you may change to: listener 1883 127.0.0.1
