name: Build desktop executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "desktop_app/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Linux x86_64
        working-directory: desktop_app
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x86_64
          path: |
            desktop_app/dist/linux/SAJ_PDM30_Gestor
            desktop_app/dist/linux/MULTI_VDF_HMI_Flasher
            desktop_app/dist/linux/LEEME.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows x64
        working-directory: desktop_app
        shell: cmd
        run: |
          call build_windows.bat
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            desktop_app/dist/windows/SAJ_PDM30_Gestor.exe
            desktop_app/dist/windows/MULTI_VDF_HMI_Flasher.exe
            desktop_app/dist/windows/LEEME.txt

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/desktop-linux-x86_64/SAJ_PDM30_Gestor release/SAJ_PDM30_Gestor-linux-x86_64
          cp artifacts/desktop-linux-x86_64/MULTI_VDF_HMI_Flasher release/MULTI_VDF_HMI_Flasher-linux-x86_64
          chmod +x release/*-linux-x86_64
          cp artifacts/desktop-windows-x64/SAJ_PDM30_Gestor.exe release/
          cp artifacts/desktop-windows-x64/MULTI_VDF_HMI_Flasher.exe release/
          ls -lh release/
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
